name: Collecte automatique des brouillons — ProjetBI

on:
  schedule:
    # Chaque matin à 06:00 UTC = 07:00 Dakar (GMT+1)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Déclenchement manuel depuis l'onglet Actions de GitHub

jobs:
  collect:
    name: Collecte et analyse
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nécessaire pour committer drafts.json

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          pip install --quiet \
            feedparser \
            requests \
            beautifulsoup4 \
            anthropic

      - name: Lancer la collecte
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_ACCESS_TOKEN:   ${{ secrets.FB_ACCESS_TOKEN }}
        run: python .github/scripts/collect_drafts.py

      - name: Committer drafts.json si modifié
        run: |
          git config user.name  "ProjetBI Bot"
          git config user.email "bot@projetbi.org"
          git add drafts.json
          if git diff --staged --quiet; then
            echo "Aucun nouveau brouillon — rien à committer."
          else
            git commit -m "🤖 Brouillons mis à jour — $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
